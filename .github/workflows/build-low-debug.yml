name: build-low-debug

on:
  workflow_dispatch:
  push:
    branches: [ dev-bridge ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # 固定调试签名：缓存 runner 的 debug.keystore，让历次构建签名一致，
      # 新 APK 才能直接覆盖安装旧 dev 版（否则每次都要卸载重解压环境）。
      - uses: actions/cache@v4
        with:
          path: ~/.android
          key: android-debug-keystore-v1

      - name: Install system tools + Android SDK/NDK
        run: |
          sudo apt-get update && sudo apt-get install -y libarchive-tools
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "build-tools;36.0.0" "ndk;26.3.11579264" || true
          sdkmanager "platforms;android-37" || sdkmanager "platforms;android-37.0" || true

      - name: Restore offline archives from official release APK
        run: |
          curl -sL -o /tmp/dsha-low.apk \
            https://github.com/DSH-APP/DSHA/releases/download/v0.1.7-rc2/dsha-0.1.7-rc2low.apk
          mkdir -p /tmp/apk && cd /tmp/apk && unzip -o -q /tmp/dsha-low.apk "assets/*"
          mkdir -p "$GITHUB_WORKSPACE/app/src/main/assets"
          for f in offline-rootfs.bin ubuntu-tools.bin; do
            if [ -f "assets/$f" ]; then
              cp "assets/$f" "$GITHUB_WORKSPACE/app/src/main/assets/$f"
              echo "restored $f ($(stat -c%s assets/$f) bytes)"
            fi
          done

      - name: Synthesize ubuntu-tools manifest for restored archive
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib
          root = pathlib.Path('.')
          script = root / 'tools/prepare-ubuntu-tools.py'
          lock_p = root / 'tools/ubuntu-tools/packages.lock.json'
          def digest(p):
              h = hashlib.sha256()
              with open(p, 'rb') as f:
                  for c in iter(lambda: f.read(1048576), b''):
                      h.update(c)
              return h.hexdigest()
          lock = json.loads(lock_p.read_text())
          binp = root / 'app/src/main/assets/ubuntu-tools.bin'
          meta = {
              'inputs': {script.relative_to(root).as_posix(): digest(script),
                         lock_p.relative_to(root).as_posix(): digest(lock_p)},
              'archive_sha256': digest(binp),
              'installed_bytes': sum(int(r['Installed-Size']) * 1024 for r in lock['packages']),
              'base_status_sha256': lock['baseStatusSha256'],
              'packages': len(lock['packages']),
          }
          out = root / 'app/src/main/assets/ubuntu-tools.inputs.json'
          out.write_text(json.dumps(meta, indent=2) + '\n')
          print('synthesized', out)
          PY

      - name: Regenerate all managed assets (canonical order)
        run: |
          set -e
          (cd tools/web-compat && npm ci)
          node tools/prepare-web-compat.mjs
          (cd tools/dsh-runtime && npm ci --ignore-scripts --os=linux --cpu=arm64 --libc=glibc)
          python3 tools/build-dsh-runtime.py \
            --source tools/dsh-runtime/node_modules \
            --output app/src/main/assets/dsh-runtime.bin
          python3 tools/prepare-backup-assets.py --write
          python3 tools/prepare-runtime-descriptor.py --write

      - name: Bundle webcode bridge as builtin plugin
        run: |
          set +e
          curl -sL --retry 3 "https://codeload.github.com/3901827159-cloud/dsh-web-bridge/tar.gz/refs/heads/main" -o /tmp/bridge.tgz || exit 0
          mkdir -p /tmp/bridge && tar xzf /tmp/bridge.tgz -C /tmp/bridge --strip-components=1 || exit 0
          SRC=/tmp/bridge/package/dsh-webcode-bridge
          [ -f "$SRC/lib/index.js" ] || exit 0
          echo "" | base64 -d > /tmp/patchbuiltin.cjs
          SRC="$SRC" node /tmp/patchbuiltin.cjs || exit 0
          DEST="$GITHUB_WORKSPACE/app/src/main/assets/builtin-plugins/dsh-webcode-bridge"
          mkdir -p "$DEST"
          cp "$SRC/package.json" "$DEST/"
          cp -r "$SRC/lib" "$DEST/lib"
          [ -f "$SRC/cordis.patch.yml" ] && cp "$SRC/cordis.patch.yml" "$DEST/"
          [ -d "$SRC/bin" ] && cp -r "$SRC/bin" "$DEST/bin"
          echo "builtin bundled: $(ls "$DEST" | tr '\n' ' ')"

      - name: Build low debug APK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          export GRADLE_OPTS="-Xmx4g"
          sh ./gradlew :app:assembleLowDebug --no-daemon --stacktrace -x :app:prepareRecoveryAssets

      - uses: actions/upload-artifact@v4
        with:
          name: dsha-low-debug
          path: app/build/outputs/apk/low/debug/*.apk
