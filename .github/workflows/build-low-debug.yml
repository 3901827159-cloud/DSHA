name: build-low-debug

on:
  workflow_dispatch:
  push:
    branches: [ dev-bridge ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install system tools + Android SDK/NDK
        run: |
          sudo apt-get update && sudo apt-get install -y libarchive-tools
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "build-tools;36.0.0" "ndk;26.3.11579264" || true
          sdkmanager "platforms;android-37" || sdkmanager "platforms;android-37.0" || true

      - name: Restore offline assets from official release APK
        run: |
          curl -sL -o /tmp/dsha-low.apk \
            https://github.com/DSH-APP/DSHA/releases/download/v0.1.7-rc2/dsha-0.1.7-rc2low.apk
          mkdir -p /tmp/apk && cd /tmp/apk && unzip -o -q /tmp/dsha-low.apk "assets/*"
          for f in offline-rootfs.bin dsh-runtime.bin ubuntu-tools.bin; do
            if [ -f "assets/$f" ]; then
              cp "assets/$f" "$GITHUB_WORKSPACE/app/src/main/assets/$f"
              echo "restored $f ($(stat -c%s assets/$f) bytes)"
            fi
          done

      - name: Regenerate managed generated assets
        run: |
          (cd tools/web-compat && npm ci)
          node tools/prepare-web-compat.mjs
          python3 tools/prepare-ubuntu-tools.py || true
          python3 tools/prepare-runtime-descriptor.py --write || true

      - name: Build low debug APK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          export GRADLE_OPTS="-Xmx4g"
          chmod +x gradlew
          ./gradlew :app:assembleLowDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: dsha-low-debug
          path: app/build/outputs/apk/low/debug/*.apk
